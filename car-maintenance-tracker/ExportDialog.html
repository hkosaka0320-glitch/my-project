<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <title>データエクスポート</title>
  <?!= include('Stylesheet') ?>
  <style>
    body { padding: 0; }
    .wrap { padding: 16px; }
    .form-group { margin-bottom: 14px; }
    .btn-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .result-box { background: #E8F5E9; border: 1px solid #A5D6A7; border-radius: 8px; padding: 12px 14px; margin-top: 12px; }
    .result-box a { color: #1B5E20; font-weight: bold; }
    .help-text { font-size: 11px; color: #777; margin-top: 3px; }
  </style>
</head>
<body>
<div class="wrap">
  <h5 style="font-weight:bold;margin-bottom:14px;color:#2E7D32">データ CSVエクスポート</h5>

  <div id="alertBox" style="display:none" class="alert alert-danger"></div>
  <div id="resultArea" style="display:none"></div>

  <div class="form-group">
    <label class="form-label required-mark">エクスポートする自動車</label>
    <select id="carSelect" class="form-select">
      <option value="">--- 選択 ---</option>
    </select>
  </div>

  <div class="help-text" style="padding:8px;background:#f5f5f5;border-radius:6px;font-size:12px">
    <strong>保存先：</strong>設定画面で指定したフォルダ（未設定の場合はマイドライブのルート）<br>
    <strong>形式：</strong>BOM付き UTF-8 CSV（Excel で直接開けます）
  </div>

  <div class="btn-footer">
    <button class="btn btn-secondary" onclick="google.script.host.close()">閉じる</button>
    <button class="btn btn-primary" id="btnExport" onclick="doExport()">
      <span id="btnText">エクスポート</span>
    </button>
  </div>
</div>

<script>
const carList = <?!= carList ?>;

window.onload = function() {
  const sel = document.getElementById('carSelect');
  carList.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    sel.appendChild(opt);
  });
  if (carList.length === 1) sel.value = carList[0];
};

function doExport() {
  const car = document.getElementById('carSelect').value;
  if (!car) { showAlert('自動車を選択してください。'); return; }

  setLoading(true);
  document.getElementById('alertBox').style.display    = 'none';
  document.getElementById('resultArea').style.display  = 'none';

  google.script.run
    .withSuccessHandler(function(res) {
      setLoading(false);
      if (res.success) {
        document.getElementById('resultArea').innerHTML = `
          <div class="result-box">
            <strong>エクスポート完了！</strong><br>
            ファイル名: ${escHtml(res.fileName)}<br>
            件数: ${res.recordCount} 件<br>
            <a href="${escHtml(res.fileUrl)}" target="_blank">Google Drive でファイルを開く</a>
          </div>`;
        document.getElementById('resultArea').style.display = '';
      } else {
        showAlert('エクスポートエラー: ' + res.error);
      }
    })
    .withFailureHandler(function(err) {
      setLoading(false);
      showAlert('エラー: ' + (err.message || err));
    })
    .exportToCsv(car);
}

function setLoading(loading) {
  document.getElementById('btnText').textContent = loading ? 'エクスポート中...' : 'エクスポート';
  document.getElementById('btnExport').disabled  = loading;
}

function showAlert(msg) {
  const el = document.getElementById('alertBox');
  el.textContent = msg; el.style.display = 'block';
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
