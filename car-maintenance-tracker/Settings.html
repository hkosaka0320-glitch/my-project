<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <title>設定</title>
  <?!= include('Stylesheet') ?>
  <style>
    body { padding: 0; }
    .wrap { padding: 16px; }
    .form-group { margin-bottom: 14px; }
    .help-text { font-size: 11px; color: #777; margin-top: 3px; }
    .car-list-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 6px; background: #fafafa; }
    .car-list-item span { flex: 1; font-weight: 600; }
    .section-title { font-size: 13px; font-weight: bold; color: #2E7D32; padding-left: 8px; border-left: 3px solid #2E7D32; margin: 14px 0 10px; }
    .add-car-row { display: flex; gap: 6px; }
    .add-car-row input { flex: 1; }
    .btn-footer { display: flex; justify-content: flex-end; gap: 8px; padding-top: 12px; border-top: 1px solid #e0e0e0; margin-top: 8px; }
    .folder-id-row { display: flex; gap: 6px; align-items: center; }
    .folder-id-row input { flex: 1; }

    /* ===== フォルダピッカー ===== */
    .fp-overlay {
      display: none; position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5); z-index: 200;
      align-items: center; justify-content: center;
    }
    .fp-modal {
      background: #fff; border-radius: 10px; width: 540px;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    .fp-header {
      background: #2E7D32; color: white;
      padding: 12px 16px; font-weight: bold; font-size: 14px;
    }
    .fp-breadcrumb {
      padding: 7px 14px; font-size: 12px; color: #444;
      background: #f5f5f5; border-bottom: 1px solid #ddd;
      min-height: 34px; display: flex; align-items: center; flex-wrap: wrap; gap: 3px;
    }
    .fp-crumb { color: #1565C0; cursor: pointer; text-decoration: underline; }
    .fp-crumb:hover { color: #0D47A1; }
    .fp-list { overflow-y: auto; min-height: 80px; max-height: 260px; }
    .fp-item {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px; cursor: pointer;
      border-bottom: 1px solid #f0f0f0; font-size: 13px;
    }
    .fp-item:hover { background: #E8F5E9; }
    .fp-item .fp-icon { font-size: 16px; flex-shrink: 0; }
    .fp-item .fp-name { flex: 1; }
    .fp-item .fp-arrow { color: #aaa; font-size: 16px; }
    .fp-empty { padding: 20px; color: #999; font-size: 12px; text-align: center; }
    .fp-footer {
      padding: 10px 14px; border-top: 1px solid #ddd;
      display: flex; gap: 8px; align-items: center;
    }
    .fp-current-info { flex: 1; font-size: 11px; color: #555; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
<div class="wrap">
  <div id="alertBox"   style="display:none" class="alert alert-danger"></div>
  <div id="successBox" style="display:none" class="alert alert-success"></div>

  <!-- ===== データ保存先 ===== -->
  <div class="section-title">データ保存先（エクスポート）</div>
  <div class="form-group">
    <label class="form-label">Google Drive フォルダ</label>
    <div class="folder-id-row">
      <input type="text" id="exportFolderId" class="form-control" placeholder="フォルダIDを貼り付け、または「選択」で参照">
      <button class="btn btn-info btn-sm" onclick="openFolderPicker()">📂 選択</button>
    </div>
    <div class="help-text">
      「📂 選択」でGoogle Driveのフォルダツリーを参照できます。<br>
      フォルダIDを直接入力することもできます（URLの末尾の文字列）。<br>
      空白の場合はマイドライブのルートに保存されます。
    </div>
  </div>

  <!-- ===== デフォルト自動車 ===== -->
  <div class="section-title">既定の自動車</div>
  <div class="form-group">
    <label class="form-label">デフォルト自動車</label>
    <select id="defaultCar" class="form-select">
      <option value="">（なし）</option>
    </select>
    <div class="help-text">入力フォームを開いた際にデフォルトで選択される自動車です。</div>
  </div>

  <!-- ===== 自動車管理 ===== -->
  <div class="section-title">自動車の管理</div>
  <div id="carListArea"></div>
  <div class="add-car-row" style="margin-top:8px">
    <input type="text" id="newCarName" class="form-control" placeholder="新しい自動車名">
    <button class="btn btn-primary btn-sm" onclick="addCar()">追加</button>
  </div>
  <div id="addCarErr" class="alert alert-danger" style="display:none;margin-top:6px;padding:6px 10px;font-size:12px"></div>

  <div class="btn-footer">
    <button class="btn btn-secondary" onclick="google.script.host.close()">キャンセル</button>
    <button class="btn btn-primary"   onclick="saveSettings()">設定を保存</button>
  </div>
</div>

<!-- ===== フォルダピッカーモーダル ===== -->
<div class="fp-overlay" id="fpOverlay">
  <div class="fp-modal">
    <div class="fp-header">📂 エクスポート先フォルダを選択</div>
    <div class="fp-breadcrumb" id="fpBreadcrumb"></div>
    <div class="fp-list" id="fpList">
      <div class="fp-empty">読み込み中...</div>
    </div>
    <div class="fp-footer">
      <span class="fp-current-info" id="fpCurrentInfo">フォルダを選択してください</span>
      <button class="btn btn-secondary btn-sm" onclick="fpGoUp()" id="fpUpBtn">↑ 上へ</button>
      <button class="btn btn-primary btn-sm"   onclick="fpSelectCurrent()">このフォルダを選択</button>
      <button class="btn btn-secondary btn-sm" onclick="closeFolderPicker()">キャンセル</button>
    </div>
  </div>
</div>

<script>
const initialSettings = <?!= settings ?>;
let carList = <?!= carList ?>;

window.onload = function() {
  document.getElementById('exportFolderId').value = initialSettings.exportFolderId || '';
  renderCarList();
  renderDefaultCarSelect();
};

// ---- 自動車リスト描画 ----
function renderCarList() {
  const area = document.getElementById('carListArea');
  if (carList.length === 0) {
    area.innerHTML = '<div style="color:#999;font-size:12px;padding:6px">登録された自動車はありません。</div>';
    return;
  }
  area.innerHTML = carList.map(name => `
    <div class="car-list-item">
      <span>${escHtml(name)}</span>
      <button class="btn btn-danger btn-sm" onclick="deleteCar('${escHtml(name)}')">削除</button>
    </div>
  `).join('');
}

// ---- デフォルト自動車セレクト ----
function renderDefaultCarSelect() {
  const sel = document.getElementById('defaultCar');
  while (sel.options.length > 1) sel.remove(1);
  carList.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    sel.appendChild(opt);
  });
  sel.value = initialSettings.defaultCar || '';
}

// ---- 自動車追加 ----
function addCar() {
  const name = document.getElementById('newCarName').value.trim();
  if (!name) { showAddCarErr('名前を入力してください。'); return; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        carList.push(res.carName);
        renderCarList();
        renderDefaultCarSelect();
        document.getElementById('newCarName').value = '';
        document.getElementById('addCarErr').style.display = 'none';
        showSuccess('「' + res.carName + '」を追加しました。');
      } else { showAddCarErr(res.error); }
    })
    .withFailureHandler(err => showAddCarErr(err.message))
    .addCar(name);
}

// ---- 自動車削除 ----
function deleteCar(name) {
  if (!confirm(`「${name}」のシートを削除してよろしいですか？\n※ このシートの整備記録が全て削除されます。`)) return;
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        carList = carList.filter(c => c !== name);
        renderCarList();
        renderDefaultCarSelect();
        showSuccess('「' + name + '」を削除しました。');
      } else { showAlert('削除エラー: ' + res.error); }
    })
    .withFailureHandler(err => showAlert('エラー: ' + err.message))
    .deleteCar(name);
}

// ---- 設定保存 ----
function saveSettings() {
  const settings = {
    exportFolderId: document.getElementById('exportFolderId').value.trim(),
    defaultCar:     document.getElementById('defaultCar').value
  };
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        showSuccess('設定を保存しました。');
        setTimeout(() => google.script.host.close(), 1200);
      } else { showAlert('保存エラー: ' + res.error); }
    })
    .withFailureHandler(err => showAlert('エラー: ' + err.message))
    .saveSettings(settings);
}

// ========================================
// フォルダピッカー
// ========================================

let fpStack = []; // [{id: string|null, name: string}] ナビゲーション履歴（現在フォルダ含む）

function openFolderPicker() {
  fpStack = [{ id: null, name: 'マイドライブ' }];
  document.getElementById('fpOverlay').style.display = 'flex';
  fpLoadFolder(null);
}

function closeFolderPicker() {
  document.getElementById('fpOverlay').style.display = 'none';
}

function fpLoadFolder(folderId) {
  document.getElementById('fpList').innerHTML = '<div class="fp-empty">読み込み中...</div>';
  fpUpdateUI();
  google.script.run
    .withSuccessHandler(fpRenderContents)
    .withFailureHandler(function(err) {
      document.getElementById('fpList').innerHTML =
        `<div style="color:#c62828;padding:12px">エラー: ${escHtml(err.message)}</div>`;
    })
    .getDriveFolders(folderId || '');
}

function fpRenderContents(data) {
  if (!data.success) {
    document.getElementById('fpList').innerHTML =
      `<div style="color:#c62828;padding:12px">エラー: ${escHtml(data.error)}</div>`;
    return;
  }

  // 現在スタックの末尾エントリを実際のフォルダ情報で更新
  fpStack[fpStack.length - 1].id   = data.currentId;
  fpStack[fpStack.length - 1].name = data.currentName;

  fpUpdateUI();

  const list = document.getElementById('fpList');
  if (data.folders.length === 0) {
    list.innerHTML = '<div class="fp-empty">サブフォルダはありません</div>';
    return;
  }
  list.innerHTML = '';
  data.folders.forEach(function(f) {
    const div = document.createElement('div');
    div.className = 'fp-item';
    div.innerHTML =
      `<span class="fp-icon">📁</span><span class="fp-name">${escHtml(f.name)}</span><span class="fp-arrow">›</span>`;
    div.onclick = function() { fpNavigateInto(f.id, f.name); };
    list.appendChild(div);
  });
}

function fpUpdateUI() {
  // パンくずリスト
  const bc = document.getElementById('fpBreadcrumb');
  bc.innerHTML = fpStack.map(function(p, i) {
    const isLast = i === fpStack.length - 1;
    if (isLast) {
      return `<span style="font-weight:bold;color:#1B5E20">${escHtml(p.name)}</span>`;
    }
    return `<span class="fp-crumb" onclick="fpGoToIndex(${i})">${escHtml(p.name)}</span> ›`;
  }).join(' ');

  // 現在フォルダ情報
  document.getElementById('fpCurrentInfo').textContent =
    '選択中: ' + fpStack.map(function(f){ return f.name; }).join(' › ');

  // 「上へ」ボタンの有効/無効
  document.getElementById('fpUpBtn').disabled = fpStack.length <= 1;
}

function fpNavigateInto(folderId, folderName) {
  fpStack.push({ id: folderId, name: folderName });
  fpLoadFolder(folderId);
}

function fpGoToIndex(index) {
  fpStack = fpStack.slice(0, index + 1);
  fpLoadFolder(fpStack[index].id);
}

function fpGoUp() {
  if (fpStack.length <= 1) return;
  fpStack.pop();
  fpLoadFolder(fpStack[fpStack.length - 1].id);
}

function fpSelectCurrent() {
  const current = fpStack[fpStack.length - 1];
  // ルート（マイドライブ）の場合は空文字にする
  const isRoot = fpStack.length === 1 && !current.id;
  document.getElementById('exportFolderId').value = isRoot ? '' : (current.id || '');
  closeFolderPicker();
  showSuccess('フォルダを選択しました：' + fpStack.map(function(f){ return f.name; }).join(' › '));
}

// ---- ユーティリティ ----
function showAddCarErr(msg) {
  const el = document.getElementById('addCarErr');
  el.textContent = msg; el.style.display = 'block';
}
function showAlert(msg) {
  const el = document.getElementById('alertBox');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('successBox').style.display = 'none';
}
function showSuccess(msg) {
  const el = document.getElementById('successBox');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('alertBox').style.display = 'none';
}
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
</body>
</html>
