<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <title>整備記録入力</title>
  <?!= include('Stylesheet') ?>
  <style>
    body { padding: 0; }
    .form-wrap { padding: 14px 16px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
    .form-group { margin-bottom: 10px; }
    .full-width { grid-column: 1 / -1; }
    .btn-footer { display: flex; justify-content: flex-end; gap: 8px; padding-top: 10px; border-top: 1px solid #e0e0e0; margin-top: 4px; }
    .car-select-row { display: flex; gap: 6px; }
    .car-select-row select { flex: 1; }
    .inline-check { display: flex; align-items: center; gap: 6px; height: 34px; }
    .inline-check input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }
    .status-panel { background: #F1F8E9; border: 1px solid #AED581; border-radius: 8px; padding: 10px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-item .stat-label { font-size: 11px; color: #555; font-weight: 600; }
    .stat-item .stat-val   { font-size: 17px; font-weight: bold; color: #2E7D32; }
    .stat-item .stat-unit  { font-size: 11px; color: #777; margin-left: 3px; }
    .stat-item .stat-none  { font-size: 13px; color: #999; }
    h5.section-title { font-size: 13px; font-weight: bold; color: #2E7D32; margin: 10px 0 6px; padding-left: 8px; border-left: 3px solid #2E7D32; }
    /* 写真エリア */
    .photo-entry { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; flex-wrap: wrap; }
    .photo-entry input[type=text] { flex: 1; min-width: 200px; }
    .photo-entry .photo-name { font-size: 11px; color: #555; flex-basis: 100%; padding-left: 2px; }
    .photo-entry .photo-status { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
    .photo-status.pending   { background: #F3E5F5; color: #6A1B9A; }
    .photo-status.uploading { background: #E3F2FD; color: #0D47A1; }
    .photo-status.done      { background: #E8F5E9; color: #1B5E20; }
    .photo-status.error     { background: #FFEBEE; color: #B71C1C; }
    .photo-btn-row { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
    .photo-help { font-size: 11px; color: #777; margin-top: 4px; }
  </style>
</head>
<body>
<div class="form-wrap">
  <div id="alertBox" style="display:none" class="alert alert-danger"></div>

  <!-- ステータスパネル -->
  <div class="status-panel" style="margin-bottom:12px">
    <div class="stat-item">
      <div class="stat-label">前回OIL交換からの距離</div>
      <div id="statOilDist"><span class="stat-none">---</span></div>
    </div>
    <div class="stat-item">
      <div class="stat-label">直近の燃費</div>
      <div id="statFuelEco"><span class="stat-none">---</span></div>
    </div>
  </div>

  <form id="mainForm" onsubmit="return false;">
    <div class="form-grid">

      <!-- 自動車名 -->
      <div class="form-group">
        <label class="form-label required-mark">自動車名</label>
        <div class="car-select-row">
          <select id="carName" class="form-select" onchange="onCarChange()">
            <option value="">--- 選択 ---</option>
          </select>
          <button type="button" class="btn btn-info btn-sm" onclick="showAddCarDialog()">追加</button>
        </div>
      </div>

      <!-- 整備年月日 -->
      <div class="form-group">
        <label class="form-label required-mark">整備年月日</label>
        <input type="date" id="date" class="form-control">
      </div>

      <!-- 整備種別 -->
      <div class="form-group">
        <label class="form-label required-mark">整備種別</label>
        <select id="type" class="form-select" onchange="onTypeChange()">
          <option value="">--- 選択 ---</option>
        </select>
      </div>

      <!-- 料金 -->
      <div class="form-group">
        <label class="form-label">料金（円）</label>
        <input type="number" id="cost" class="form-control" placeholder="例: 3500" min="0">
      </div>

      <!-- OILエレメント（オイル交換時のみ） -->
      <div class="form-group" id="rowOilElem" style="display:none">
        <label class="form-label">OILエレメント交換</label>
        <div class="inline-check">
          <input type="checkbox" id="oilElement">
          <label for="oilElement" style="cursor:pointer">交換あり</label>
        </div>
      </div>

      <!-- 給油量（給油時のみ） -->
      <div class="form-group" id="rowFuelAmt" style="display:none">
        <label class="form-label required-mark">給油量（L）</label>
        <input type="number" id="fuelAmount" class="form-control" placeholder="例: 40.5" step="0.01" min="0">
      </div>

      <!-- メーター距離 -->
      <div class="form-group">
        <label class="form-label">メーター距離（km）</label>
        <input type="number" id="odometer" class="form-control" placeholder="例: 52340" min="0">
      </div>

      <!-- 給油状態（給油時のみ） -->
      <div class="form-group" id="rowFuelStatus" style="display:none">
        <label class="form-label required-mark">給油状態</label>
        <select id="fuelStatus" class="form-select">
          <option value="">--- 選択 ---</option>
        </select>
      </div>

      <!-- メモ -->
      <div class="form-group">
        <label class="form-label">メモ</label>
        <textarea id="memo" class="form-control" rows="2" placeholder="作業メモなど"></textarea>
      </div>

      <!-- 摘要 -->
      <div class="form-group">
        <label class="form-label">摘要</label>
        <textarea id="summary" class="form-control" rows="2" placeholder="請求先・作業概要など"></textarea>
      </div>

    </div><!-- /form-grid -->

    <!-- 写真セクション（全幅） -->
    <hr class="section-divider">
    <h5 class="section-title">写真</h5>

    <!-- 写真一覧 -->
    <div id="photoList"></div>

    <!-- ボタン行 -->
    <div class="photo-btn-row">
      <input type="file" id="photoFileInput" multiple accept="image/*"
             style="display:none" onchange="handlePhotoFiles(this)">
      <button type="button" class="btn btn-primary btn-sm" onclick="document.getElementById('photoFileInput').click()">
        📁 ファイルを選択
      </button>
      <button type="button" class="btn btn-secondary btn-sm" onclick="addPhotoUrlField()">
        🔗 URLを手入力
      </button>
    </div>
    <div class="photo-help">
      「ファイルを選択」でPC上の写真を選択できます。保存ボタンを押すと他のデータと同時にGoogle Driveへ保存されます。<br>
      複数ファイルを一度に選択できます（最大10枚）。
    </div>

    <div class="btn-footer">
      <button type="button" class="btn btn-secondary" onclick="google.script.host.close()">キャンセル</button>
      <button type="button" class="btn btn-primary" id="btnSave" onclick="submitForm()">
        <span id="btnSaveText">保存</span>
      </button>
    </div>
  </form>
</div>

<!-- 自動車追加ダイアログ -->
<div id="addCarOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:100">
  <div style="background:#fff;border-radius:10px;padding:20px;width:300px;margin:120px auto;">
    <h6 style="margin-bottom:12px;font-weight:bold">自動車を追加</h6>
    <input type="text" id="newCarName" class="form-control" placeholder="自動車名を入力" style="margin-bottom:12px">
    <div id="addCarError" class="alert alert-danger" style="display:none;padding:6px 10px;font-size:12px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-secondary btn-sm" onclick="hideAddCarDialog()">キャンセル</button>
      <button class="btn btn-primary btn-sm"   onclick="doAddCar()">追加</button>
    </div>
  </div>
</div>

<script>
const editData          = <?!= editData ?>;
const carList           = <?!= carList ?>;
const maintenanceTypes  = <?!= maintenanceTypes ?>;
const fuelStatusOptions = <?!= fuelStatusOptions ?>;
let isEdit = (editData !== null);

// 選択済みファイル（未アップロード）
let pendingFiles = []; // [{ file, entryId }]

// ---- 初期化 ----
window.onload = function() {
  const sel = document.getElementById('carName');
  carList.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    sel.appendChild(opt);
  });
  const typeSel = document.getElementById('type');
  maintenanceTypes.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    typeSel.appendChild(opt);
  });
  const fsSel = document.getElementById('fuelStatus');
  fuelStatusOptions.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    fsSel.appendChild(opt);
  });
  if (!isEdit) {
    const today = new Date();
    document.getElementById('date').value =
      today.getFullYear() + '-' +
      String(today.getMonth() + 1).padStart(2,'0') + '-' +
      String(today.getDate()).padStart(2,'0');
  }
  if (isEdit) {
    fillEditData(editData);
  } else if (carList.length > 0) {
    sel.value = carList[0];
    loadCarSummary(carList[0]);
  }
  onTypeChange();
};

// ---- 編集データをフォームに反映 ----
function fillEditData(d) {
  setVal('carName',    d.carName    || '');
  setVal('type',       d.type       || '');
  setVal('cost',       d.cost       || '');
  setVal('odometer',   d.odometer   || '');
  setVal('memo',       d.memo       || '');
  setVal('summary',    d.summary    || '');
  setVal('fuelAmount', d.fuelAmount || '');
  setVal('fuelStatus', d.fuelStatus || '');
  document.getElementById('oilElement').checked = (d.oilElement === '○');
  if (d.date) document.getElementById('date').value = d.date.replace(/\//g, '-');
  if (d.photos && d.photos.length > 0) {
    d.photos.forEach(url => addPhotoUrlFieldWithValue(url));
  }
  loadCarSummary(d.carName);
  onTypeChange();
}

// ---- 自動車変更 ----
function onCarChange() {
  const car = document.getElementById('carName').value;
  if (car) loadCarSummary(car); else clearSummary();
}

function loadCarSummary(carName) {
  if (!carName) { clearSummary(); return; }
  google.script.run
    .withSuccessHandler(showSummary)
    .withFailureHandler(console.error)
    .getCarSummary(carName);
}

function showSummary(data) {
  const oilEl  = document.getElementById('statOilDist');
  const fuelEl = document.getElementById('statFuelEco');
  oilEl.innerHTML  = (data.oilDistance !== null && data.oilDistance !== undefined && data.oilDistance !== '')
    ? `<span class="stat-val">${Number(data.oilDistance).toLocaleString()}</span><span class="stat-unit">km</span>`
    : '<span class="stat-none">記録なし</span>';
  fuelEl.innerHTML = (data.latestFuelEconomy !== null && data.latestFuelEconomy !== undefined && data.latestFuelEconomy !== '')
    ? `<span class="stat-val">${data.latestFuelEconomy}</span><span class="stat-unit">km/L</span>`
    : '<span class="stat-none">記録なし</span>';
}

function clearSummary() {
  document.getElementById('statOilDist').innerHTML = '<span class="stat-none">---</span>';
  document.getElementById('statFuelEco').innerHTML = '<span class="stat-none">---</span>';
}

// ---- 整備種別変更 ----
function onTypeChange() {
  const type = document.getElementById('type').value;
  setVisible('rowFuelAmt',    type === '給油');
  setVisible('rowFuelStatus', type === '給油');
  setVisible('rowOilElem',    type === 'オイル交換');
}

// ========================================
// 写真管理（保存ボタン押下時にアップロード）
// ========================================

/**
 * ファイルを選んだときの処理 — アップロードはせずに pending リストに追加
 */
function handlePhotoFiles(input) {
  const files = Array.from(input.files);
  if (files.length === 0) return;

  const car = document.getElementById('carName').value;
  if (!car) {
    alert('先に自動車名を選択してください。');
    input.value = '';
    return;
  }

  const currentCount = document.querySelectorAll('.photo-entry').length;
  if (currentCount + files.length > 10) {
    alert('写真は最大10枚です。\n現在 ' + currentCount + ' 枚登録済みです。');
    input.value = '';
    return;
  }

  files.forEach(function(file) {
    if (file.size > 10 * 1024 * 1024) {
      alert('「' + file.name + '」はファイルサイズが大きすぎます（10MB以下にしてください）。');
      return;
    }
    addPendingPhotoEntry(file);
  });

  input.value = '';
}

/**
 * 選択済みファイルを「保存待ち」としてUIに追加
 */
function addPendingPhotoEntry(file) {
  const entryId = 'photo_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
  pendingFiles.push({ file: file, entryId: entryId });

  const list = document.getElementById('photoList');
  const div  = document.createElement('div');
  div.className = 'photo-entry';
  div.id = entryId;
  div.dataset.pendingId = entryId;
  div.innerHTML =
    '<input type="text" class="form-control photo-url" value="" placeholder="保存時にアップロードされます" readonly style="color:#999">' +
    '<span class="photo-status pending">📎 選択済</span>' +
    '<span class="photo-name">📄 ' + escHtml(file.name) + '</span>' +
    '<button type="button" class="btn btn-danger btn-sm" onclick="removePhotoField(this)">削除</button>';
  list.appendChild(div);
}

/**
 * 写真エントリを削除（pending リストからも除去）
 */
function removePhotoField(btn) {
  const entry = btn.closest('.photo-entry');
  const pendingId = entry.dataset.pendingId;
  if (pendingId) {
    pendingFiles = pendingFiles.filter(function(p) { return p.entryId !== pendingId; });
  }
  entry.remove();
}

/**
 * URL手動入力フィールドを追加
 */
function addPhotoUrlField() {
  addPhotoUrlFieldWithValue('');
}

function addPhotoUrlFieldWithValue(url) {
  const list = document.getElementById('photoList');
  if (list.children.length >= 10) { alert('写真は最大10枚までです。'); return; }
  const div = document.createElement('div');
  div.className = 'photo-entry';
  div.innerHTML =
    '<input type="text" class="form-control photo-url" placeholder="Google Drive 共有URL" value="' + (url ? escHtml(url) : '') + '">' +
    '<span class="photo-status done" style="' + (url ? '' : 'display:none') + '">🔗 URL</span>' +
    '<button type="button" class="btn btn-danger btn-sm" onclick="removePhotoField(this)">削除</button>';
  list.appendChild(div);
}

/**
 * pending ファイルを1件ずつアップロードしてから callback を呼ぶ（再帰）
 */
function uploadNextPendingFile(car, index, callback) {
  if (index >= pendingFiles.length) {
    // 全アップロード完了 → データ保存へ
    pendingFiles = [];
    callback();
    return;
  }

  const total = pendingFiles.length;
  document.getElementById('btnSaveText').textContent =
    '写真アップロード中 (' + (index + 1) + '/' + total + ')...';

  const item    = pendingFiles[index];
  const entry   = document.getElementById(item.entryId);

  if (entry) {
    entry.querySelector('.photo-status').textContent = '📤 送信中';
    entry.querySelector('.photo-status').className   = 'photo-status uploading';
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    const base64 = e.target.result.split(',')[1];
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res.success) {
          // アップロード失敗 → エラー表示して中断
          if (entry) {
            entry.querySelector('.photo-status').textContent = '❌ 失敗';
            entry.querySelector('.photo-status').className   = 'photo-status error';
            entry.querySelector('.photo-name').textContent   = '⚠️ ' + (res.error || 'エラー');
          }
          document.getElementById('btnSave').disabled = false;
          showAlert('写真のアップロードに失敗しました: ' + (res.error || 'エラー'));
          document.getElementById('btnSaveText').textContent = '保存';
          return;
        }
        // 成功 → URLをセット
        if (entry) {
          entry.querySelector('.photo-url').value       = res.fileUrl;
          entry.querySelector('.photo-url').readOnly    = false;
          entry.querySelector('.photo-url').style.color = '';
          entry.querySelector('.photo-url').placeholder = 'Google Drive URL';
          entry.querySelector('.photo-status').textContent = '✅ 保存済';
          entry.querySelector('.photo-status').className   = 'photo-status done';
          entry.querySelector('.photo-name').textContent   = '📄 ' + res.fileName;
          delete entry.dataset.pendingId; // pending 解除
        }
        // 次のファイルへ
        uploadNextPendingFile(car, index + 1, callback);
      })
      .withFailureHandler(function(err) {
        if (entry) {
          entry.querySelector('.photo-status').textContent = '❌ エラー';
          entry.querySelector('.photo-status').className   = 'photo-status error';
        }
        document.getElementById('btnSave').disabled = false;
        document.getElementById('btnSaveText').textContent = '保存';
        showAlert('写真のアップロードに失敗しました: ' + (err.message || 'エラー'));
      })
      .savePhotoToDrive(base64, item.file.name, item.file.type, car);
  };
  reader.readAsDataURL(item.file);
}

// ---- フォーム送信 ----
function submitForm() {
  hideAlert();

  const car  = document.getElementById('carName').value;
  const date = document.getElementById('date').value;
  const type = document.getElementById('type').value;

  if (!car)  { showAlert('自動車名を選択してください。');   return; }
  if (!date) { showAlert('整備年月日を入力してください。'); return; }
  if (!type) { showAlert('整備種別を選択してください。');   return; }

  if (type === '給油') {
    if (!document.getElementById('fuelAmount').value) { showAlert('給油量を入力してください。');  return; }
    if (!document.getElementById('fuelStatus').value) { showAlert('給油状態を選択してください。'); return; }
  }

  document.getElementById('btnSave').disabled = true;

  if (pendingFiles.length > 0) {
    // 写真を先にアップロードしてから保存
    uploadNextPendingFile(car, 0, function() {
      doSaveRecord(car, date, type);
    });
  } else {
    // 写真なし（またはURL入力のみ）
    doSaveRecord(car, date, type);
  }
}

function doSaveRecord(car, date, type) {
  document.getElementById('btnSaveText').textContent = '保存中...';

  const photos = Array.from(document.querySelectorAll('.photo-url'))
    .map(function(el) { return el.value.trim(); }).filter(Boolean);

  const data = {
    carName:    car,
    date:       date,
    type:       type,
    oilElement: document.getElementById('oilElement').checked ? '○' : '',
    fuelAmount: document.getElementById('fuelAmount').value,
    cost:       document.getElementById('cost').value,
    odometer:   document.getElementById('odometer').value,
    fuelStatus: document.getElementById('fuelStatus').value,
    memo:       document.getElementById('memo').value,
    summary:    document.getElementById('summary').value,
    photos:     photos
  };
  if (isEdit) data.rowIndex = editData.rowIndex;

  const fn = isEdit
    ? google.script.run.withSuccessHandler(onSaveSuccess).withFailureHandler(onSaveError).updateRecord
    : google.script.run.withSuccessHandler(onSaveSuccess).withFailureHandler(onSaveError).saveRecord;
  fn(data);
}

function onSaveSuccess(result) {
  document.getElementById('btnSave').disabled = false;
  document.getElementById('btnSaveText').textContent = '保存';
  if (result.success) { google.script.host.close(); }
  else { showAlert('保存エラー: ' + result.error); }
}
function onSaveError(err) {
  document.getElementById('btnSave').disabled = false;
  document.getElementById('btnSaveText').textContent = '保存';
  showAlert('エラー: ' + (err.message || err));
}

// ---- 自動車追加ダイアログ ----
function showAddCarDialog() { document.getElementById('addCarOverlay').style.display = 'block'; }
function hideAddCarDialog() {
  document.getElementById('addCarOverlay').style.display = 'none';
  document.getElementById('newCarName').value = '';
  document.getElementById('addCarError').style.display = 'none';
}
function doAddCar() {
  const name = document.getElementById('newCarName').value.trim();
  if (!name) { showAddCarErr('名前を入力してください。'); return; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        const sel = document.getElementById('carName');
        const opt = document.createElement('option');
        opt.value = res.carName; opt.textContent = res.carName;
        sel.appendChild(opt);
        sel.value = res.carName;
        hideAddCarDialog();
        loadCarSummary(res.carName);
      } else { showAddCarErr(res.error); }
    })
    .withFailureHandler(err => showAddCarErr(err.message))
    .addCar(name);
}
function showAddCarErr(msg) {
  const el = document.getElementById('addCarError');
  el.textContent = msg; el.style.display = 'block';
}

// ---- ユーティリティ ----
function setVal(id, v)  { const el = document.getElementById(id); if (el) el.value = v; }
function setVisible(id, show) { document.getElementById(id).style.display = show ? '' : 'none'; }
function showAlert(msg) {
  const el = document.getElementById('alertBox');
  el.textContent = msg; el.style.display = 'block';
  el.scrollIntoView({ behavior: 'smooth' });
}
function hideAlert() { document.getElementById('alertBox').style.display = 'none'; }
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
</body>
</html>
