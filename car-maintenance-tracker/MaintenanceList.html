<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <title>整備一覧</title>
  <?!= include('Stylesheet') ?>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body { padding: 0; }
    .main-wrap { display: flex; flex-direction: column; height: 100vh; padding: 12px; box-sizing: border-box; }
    .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
    .tab-btn { padding: 5px 18px; border: 1px solid #ccc; background: #f5f5f5; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 12px; font-weight: 600; }
    .tab-btn.active { background: #2E7D32; color: white; border-color: #2E7D32; }
    .tab-content { display: none; flex: 1; overflow: hidden; }
    .tab-content.active { display: flex; flex-direction: column; }
    .table-wrap { overflow: auto; flex: 1; border: 1px solid #ddd; border-radius: 0 6px 6px 6px; }
    .stat-bar { display: flex; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
    .stat-card { background: #E8F5E9; border: 1px solid #A5D6A7; border-radius: 8px; padding: 8px 16px; min-width: 140px; }
    .stat-card.warn { background: #FFF8E1; border-color: #FFE082; }
    .stat-card .s-label { font-size: 11px; color: #555; font-weight: 600; }
    .stat-card .s-val   { font-size: 18px; font-weight: bold; color: #1B5E20; }
    .stat-card.warn .s-val { color: #E65100; }
    .stat-card .s-unit  { font-size: 11px; color: #777; margin-left: 3px; }
    .chart-wrap { flex: 1; overflow: auto; padding: 12px; }
    select.toolbar-sel { height: 32px; font-size: 12px; border: 1px solid #ccc; border-radius: 6px; padding: 0 8px; min-width: 150px; }
    input.toolbar-input { height: 32px; font-size: 12px; border: 1px solid #ccc; border-radius: 6px; padding: 0 8px; width: 140px; }
    .action-btns { display: flex; gap: 4px; }
    .no-data { text-align: center; padding: 40px; color: #999; }
    td.td-date   { white-space: nowrap; }
    td.td-num    { text-align: right; }
    td.td-center { text-align: center; }
    .type-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
    .fuel-eco-good { color: #1B5E20; font-weight: bold; }
    .fuel-eco-bad  { color: #E53935; font-weight: bold; }
    .photos-cell a { font-size: 10px; display: inline-block; margin: 1px; }
    /* 行クリック用スタイル */
    table.maint-table tbody tr { cursor: pointer; }
    table.maint-table tbody tr:hover td { filter: brightness(0.92); }
    .row-hint { font-size: 10px; color: #999; margin-top: 4px; }

    /* ===== 印刷用スタイル ===== */
    @media print {
      .toolbar     { display: none !important; }
      .tabs        { display: none !important; }
      .stat-bar    { margin-bottom: 8px; }
      .action-btns { display: none !important; }
      .main-wrap   { padding: 0; height: auto; }
      body         { background: white; font-size: 11px; }
      .print-header { display: block !important; }
      @page { margin: 1.5cm; }

      /* アクティブなタブだけ表示 */
      .tab-content        { display: none !important; }
      .tab-content.active { display: block !important; }

      /* データ一覧タブ */
      #tabData.active     { display: flex !important; flex-direction: column; }
      .table-wrap         { overflow: visible; border: none; }
      table.maint-table th, table.maint-table td { font-size: 10px; padding: 3px 5px; }

      /* 燃費グラフタブ */
      #tabChart.active    { display: block !important; }
      .chart-wrap         { overflow: visible; padding: 8px 0; }
      #fuelChart          { max-height: none !important; width: 100% !important; }
    }
    .print-header {
      display: none;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 2px solid #333;
    }
  </style>
</head>
<body>
<div class="main-wrap">

  <!-- 印刷時ヘッダー -->
  <div class="print-header" id="printHeader">整備記録一覧</div>

  <!-- ツールバー -->
  <div class="toolbar">
    <label style="font-weight:600;font-size:13px">自動車：</label>
    <select id="carSelect" class="toolbar-sel" onchange="onCarChange()">
      <option value="">--- 選択 ---</option>
    </select>

    <label style="font-weight:600;font-size:13px">種別：</label>
    <select id="typeFilter" class="toolbar-sel" onchange="renderTable()">
      <option value="">すべて</option>
      <option>給油</option><option>オイル交換</option><option>タイヤ交換</option>
      <option>車検</option><option>保険</option><option>ワイパー交換</option>
      <option>洗車</option><option>その他整備</option>
    </select>

    <input type="text" id="searchBox" class="toolbar-input" placeholder="キーワード検索" oninput="renderTable()">

    <button class="btn btn-primary btn-sm"  onclick="onCarChange()">再読込</button>
    <button class="btn btn-warning btn-sm"  onclick="doRecalc()">再計算</button>
    <button class="btn btn-info btn-sm"     onclick="doSort()">日付順並び替え</button>
    <button class="btn btn-secondary btn-sm" onclick="doPrint()">印刷</button>
    <button class="btn btn-secondary btn-sm" onclick="google.script.host.close()">閉じる</button>
  </div>

  <!-- ステータスバー -->
  <div class="stat-bar" id="statBar" style="display:none">
    <div class="stat-card">
      <div class="s-label">直近の燃費</div>
      <div><span class="s-val" id="sLatestEco">---</span><span class="s-unit">km/L</span></div>
    </div>
    <div class="stat-card warn">
      <div class="s-label">OIL交換からの距離</div>
      <div><span class="s-val" id="sOilDist">---</span><span class="s-unit">km</span></div>
    </div>
    <div class="stat-card">
      <div class="s-label">給油記録数</div>
      <div><span class="s-val" id="sFuelCount">0</span><span class="s-unit">件</span></div>
    </div>
    <div class="stat-card">
      <div class="s-label">総記録数</div>
      <div><span class="s-val" id="sTotalCount">0</span><span class="s-unit">件</span></div>
    </div>
  </div>

  <!-- タブ -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('data')">データ一覧</button>
    <button class="tab-btn"        onclick="switchTab('chart')">燃費グラフ</button>
  </div>

  <!-- データ一覧タブ -->
  <div id="tabData" class="tab-content active">
    <div class="row-hint">※ 行をクリックすると編集できます</div>
    <div class="table-wrap">
      <div id="tableArea"><div class="no-data">自動車を選択してください。</div></div>
    </div>
  </div>

  <!-- 燃費グラフタブ -->
  <div id="tabChart" class="tab-content">
    <div class="chart-wrap">
      <canvas id="fuelChart" style="max-height:420px"></canvas>
      <div id="chartNoData" class="no-data" style="display:none">燃費データがありません。</div>
    </div>
  </div>

</div>

<script>
const carList = <?!= carList ?>;
let allRecords = [];
let chartInstance = null;

// ---- 初期化 ----
window.onload = function() {
  const sel = document.getElementById('carSelect');
  carList.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    sel.appendChild(opt);
  });
  if (carList.length > 0) {
    sel.value = carList[0];
    loadRecords(carList[0]);
  }
};

// ---- 自動車変更 ----
function onCarChange() {
  const car = document.getElementById('carSelect').value;
  if (!car) { allRecords = []; renderTable(); return; }
  showLoading();
  loadRecords(car);
}

function loadRecords(carName) {
  google.script.run
    .withSuccessHandler(function(data) {
      allRecords = (data || []).reverse(); // 新しい順（表示）
      renderTable();
      loadSummary(carName);
      if (document.getElementById('tabChart').classList.contains('active')) renderChart();
    })
    .withFailureHandler(function(err) {
      document.getElementById('tableArea').innerHTML =
        `<div class="no-data" style="color:#c62828">読み込みエラー: ${err.message}</div>`;
    })
    .getRecords(carName);
}

function loadSummary(carName) {
  google.script.run
    .withSuccessHandler(function(s) {
      document.getElementById('statBar').style.display = '';
      document.getElementById('sLatestEco').textContent =
        s.latestFuelEconomy !== null ? s.latestFuelEconomy : '---';
      document.getElementById('sOilDist').textContent =
        s.oilDistance !== null ? Number(s.oilDistance).toLocaleString() : '---';
    })
    .withFailureHandler(console.error)
    .getCarSummary(carName);
}

// ---- テーブル描画 ----
function renderTable() {
  const car        = document.getElementById('carSelect').value;
  const typeFilter = document.getElementById('typeFilter').value;
  const keyword    = document.getElementById('searchBox').value.trim().toLowerCase();

  // 印刷ヘッダーを更新
  document.getElementById('printHeader').textContent =
    (car ? car + ' ' : '') + '整備記録一覧　' + new Date().toLocaleDateString('ja-JP');

  let filtered = allRecords.filter(r => {
    if (typeFilter && r.type !== typeFilter) return false;
    if (keyword) {
      const hay = [r.date, r.type, r.memo, r.summary, r.odometer, r.cost].join(' ').toLowerCase();
      if (!hay.includes(keyword)) return false;
    }
    return true;
  });

  document.getElementById('sFuelCount').textContent  = allRecords.filter(r => r.type === '給油').length;
  document.getElementById('sTotalCount').textContent = allRecords.length;

  if (filtered.length === 0) {
    document.getElementById('tableArea').innerHTML = '<div class="no-data">データがありません。</div>';
    return;
  }

  let html = `<table class="maint-table"><thead><tr>
    <th>日付</th><th>種別</th><th>エレメント</th><th>給油量(L)</th>
    <th>料金(円)</th><th>距離(km)</th><th>給油状態</th><th>円/L</th>
    <th>燃費(km/L)</th><th>OIL距離(km)</th><th>メモ</th><th>摘要</th><th>写真</th><th>操作</th>
  </tr></thead><tbody>`;

  filtered.forEach(r => {
    const typeBadge = makeTypeBadge(r.type);
    const eco = r.fuelEconomy !== ''
      ? `<span class="${r.fuelEconomy >= 15 ? 'fuel-eco-good' : r.fuelEconomy >= 10 ? '' : 'fuel-eco-bad'}">${r.fuelEconomy}</span>` : '';
    const oilD   = r.oilDistance !== '' ? Number(r.oilDistance).toLocaleString() : '';
    const photos = (r.photos || []).map((p, i) =>
      `<a href="${escHtml(p)}" target="_blank" onclick="event.stopPropagation()">📷${i+1}</a>`).join(' ');
    // 円/L（給油かつ給油量>0のときのみ計算）
    const fuelAmt = parseFloat(r.fuelAmount);
    const cost    = parseFloat(r.cost);
    const costPerL = (r.type === '給油' && fuelAmt > 0 && !isNaN(cost))
      ? (Math.round(cost / fuelAmt * 10) / 10).toFixed(1) : '';

    html += `<tr onclick="editRecord(${r.rowIndex})" title="クリックして編集">
      <td class="td-date">${escHtml(r.date)}</td>
      <td class="td-center">${typeBadge}</td>
      <td class="td-center">${r.oilElement === '○' ? '○' : ''}</td>
      <td class="td-num">${r.fuelAmount !== '' ? r.fuelAmount : ''}</td>
      <td class="td-num">${r.cost !== '' ? Number(r.cost).toLocaleString() : ''}</td>
      <td class="td-num">${r.odometer !== '' ? Number(r.odometer).toLocaleString() : ''}</td>
      <td class="td-center">${escHtml(r.fuelStatus)}</td>
      <td class="td-num">${costPerL}</td>
      <td class="td-num">${eco}</td>
      <td class="td-num">${oilD}</td>
      <td>${escHtml(r.memo)}</td>
      <td>${escHtml(r.summary)}</td>
      <td class="photos-cell">${photos}</td>
      <td class="td-center" onclick="event.stopPropagation()">
        <div class="action-btns">
          <button class="btn btn-info btn-sm"    onclick="editRecord(${r.rowIndex})">編集</button>
          <button class="btn btn-danger btn-sm"  onclick="deleteRecord(${r.rowIndex},'${escHtml(r.date)}')">削除</button>
        </div>
      </td>
    </tr>`;
  });

  html += '</tbody></table>';
  document.getElementById('tableArea').innerHTML = html;
}

// ---- 種別バッジ ----
const BADGE_MAP = {
  '給油':'badge-fuel','オイル交換':'badge-oil','タイヤ交換':'badge-tire',
  '車検':'badge-shaken','保険':'badge-insurance','ワイパー交換':'badge-wiper',
  '洗車':'badge-wash','その他整備':'badge-other'
};
function makeTypeBadge(type) {
  const cls = BADGE_MAP[type] || 'badge-other';
  return `<span class="type-badge ${cls}">${escHtml(type)}</span>`;
}

// ---- 燃費グラフ ----
function renderChart() {
  const car = document.getElementById('carSelect').value;
  if (!car) return;
  google.script.run
    .withSuccessHandler(function(chartData) {
      const noData = document.getElementById('chartNoData');
      if (!chartData || chartData.length === 0) {
        noData.style.display = '';
        if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
        return;
      }
      noData.style.display = 'none';
      const labels = chartData.map(d => d.date);
      const values = chartData.map(d => d.fuelEconomy);
      const avg    = (values.reduce((a,b) => a+b, 0) / values.length).toFixed(1);
      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(document.getElementById('fuelChart'), {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: '燃費 (km/L)',
              data: values,
              borderColor: '#2E7D32',
              backgroundColor: 'rgba(46,125,50,0.12)',
              pointBackgroundColor: '#2E7D32',
              pointRadius: 5,
              fill: true,
              tension: 0.3
            },
            {
              label: `平均: ${avg} km/L`,
              data: Array(values.length).fill(parseFloat(avg)),
              borderColor: '#FB8C00',
              borderDash: [6,4],
              borderWidth: 2,
              pointRadius: 0,
              fill: false
            }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            title:   { display: true, text: `${car} 燃費推移`, font: { size: 15 } },
            legend:  { position: 'bottom' },
            tooltip: { callbacks: { label: ctx => `燃費: ${ctx.raw} km/L` } }
          },
          scales: {
            y: { title: { display: true, text: 'km/L' }, beginAtZero: false },
            x: { title: { display: true, text: '日付' } }
          }
        }
      });
    })
    .withFailureHandler(console.error)
    .getFuelEconomyData(car);
}

// ---- 編集（行クリック or 編集ボタン） ----
function editRecord(rowIndex) {
  const car = document.getElementById('carSelect').value;
  const rec = allRecords.find(r => r.rowIndex === rowIndex);
  if (!rec) return;
  const editData = Object.assign({}, rec, { carName: car });
  google.script.run
    .withSuccessHandler(function() { google.script.host.close(); })
    .withFailureHandler(err => alert('エラー: ' + err.message))
    .showInputForm(editData);
}

// ---- 削除 ----
function deleteRecord(rowIndex, dateStr) {
  if (!confirm(`${dateStr} の記録を削除してよろしいですか？`)) return;
  const car = document.getElementById('carSelect').value;
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        allRecords = allRecords.filter(r => r.rowIndex !== rowIndex);
        renderTable();
        loadSummary(car);
      } else { alert('削除エラー: ' + res.error); }
    })
    .withFailureHandler(err => alert('エラー: ' + err.message))
    .deleteRecord(car, rowIndex);
}

// ---- 再計算 ----
function doRecalc() {
  const car = document.getElementById('carSelect').value;
  if (!car) { alert('自動車を選択してください。'); return; }
  google.script.run
    .withSuccessHandler(function() { loadRecords(car); alert('再計算が完了しました。'); })
    .withFailureHandler(err => alert('エラー: ' + err.message))
    .recalculateCarData(car);
}

// ---- 日付順並び替え ----
function doSort() {
  const car = document.getElementById('carSelect').value;
  if (!car) { alert('自動車を選択してください。'); return; }
  if (!confirm(`「${car}」のデータをスプレッドシート上で\n日付の古い順（昇順）に並び替えますか？\n\n※ この操作はスプレッドシート内のデータを並び替えます。`)) return;
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        loadRecords(car);
        alert('日付順に並び替えました。');
      } else { alert('並び替えエラー: ' + res.error); }
    })
    .withFailureHandler(err => alert('エラー: ' + err.message))
    .sortSheetByDate(car);
}

// ---- 印刷 ----
function doPrint() {
  // 現在表示中のタブをそのまま印刷（データ一覧 or 燃費グラフ）
  const isChart = document.getElementById('tabChart').classList.contains('active');
  if (isChart) {
    // グラフが未描画の場合は先に描画してから印刷
    renderChart();
    setTimeout(function() { window.print(); }, 600);
  } else {
    setTimeout(function() { window.print(); }, 300);
  }
}

// ---- タブ切替 ----
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && tab === 'data') || (i === 1 && tab === 'chart'));
  });
  document.getElementById('tabData').classList.toggle('active',  tab === 'data');
  document.getElementById('tabChart').classList.toggle('active', tab === 'chart');
  if (tab === 'chart') renderChart();
}

// ---- ユーティリティ ----
function showLoading() {
  document.getElementById('tableArea').innerHTML =
    '<div class="loading"><span class="spinner"></span>読み込み中...</div>';
}

function escHtml(s) {
  if (!s && s !== 0) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
</body>
</html>
