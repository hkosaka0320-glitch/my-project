<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在庫管理</title>
<style>
body{font-family:sans-serif;max-width:600px;margin:0 auto;padding:16px;background:#f0f4f8}
h1{color:#1976D2;font-size:22px;margin-bottom:16px}
textarea{width:100%;height:180px;padding:8px;font-size:13px;border:1px solid #ccc;border-radius:6px;font-family:monospace;box-sizing:border-box}
button{background:#1976D2;color:#fff;border:none;padding:10px 20px;border-radius:6px;font-size:14px;cursor:pointer;margin:6px 4px 6px 0}
button.g{background:#2E7D32} button.s{background:#757575}
.box{background:#fff;padding:16px;border-radius:8px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.box h2{color:#1976D2;font-size:14px;font-weight:700;margin:0 0 8px;padding-bottom:4px;border-bottom:2px solid #1976D2}
label{display:flex;align-items:center;gap:8px;padding:8px 4px;cursor:pointer;font-size:14px}
label:hover{background:#f5f5f5;border-radius:4px}
input[type=checkbox]{width:18px;height:18px;accent-color:#1976D2}
.card{background:#f9f9f9;border-radius:6px;padding:12px;margin:6px 0;border-left:4px solid #1976D2}
.hb{font-weight:700;color:#1976D2;margin-bottom:4px}
.dt{font-size:12px;color:#666;margin:2px 0}
pre{font-family:monospace;font-size:14px;line-height:1.9;margin:0}
.hide{display:none}
#cnt{font-weight:700;color:#1976D2;margin-bottom:8px}
</style>
</head>
<body>
<h1>📦 写真在庫管理</h1>

<!-- 画面1: テキスト入力 -->
<div id="s1">
  <div class="box">
    <h2>OCRテキストを貼り付け</h2>
    <p style="font-size:12px;color:#666;margin:0 0 8px">Google レンズ等でOCRしたテキストを貼り付けてください</p>
    <textarea id="txt" placeholder="テキストをここに貼り付け..."></textarea>
  </div>
  <button onclick="parse()">解析する →</button>
</div>

<!-- 画面2: チェックボックス -->
<div id="s2" class="hide">
  <div class="box"><h2>納期</h2><div id="noki"></div></div>
  <div class="box"><h2>納入先</h2><div id="nyusaki"></div></div>
  <button onclick="showResult()">結果を表示 →</button>
  <button class="s" onclick="go(1)">← 戻る</button>
</div>

<!-- 画面3: 抽出結果 -->
<div id="s3" class="hide">
  <div id="cnt"></div>
  <div id="list"></div>
  <button class="g" onclick="showSummary()">OK → 集計</button>
  <button class="s" onclick="go(2)">← 戻る</button>
</div>

<!-- 画面4: 集計結果 -->
<div id="s4" class="hide">
  <div class="box"><h2>集計結果</h2><pre id="sum"></pre></div>
  <button onclick="go(1)">最初に戻る</button>
</div>

<script>
const RE=/[A-Z0-9]{4}T[A-Z0-9]([2-5]\d{2}|6[0-4]\d|650)/i;
let all=[],selK=new Set(),selN=new Set(),filtered=[];

function go(n){[1,2,3,4].forEach(i=>document.getElementById('s'+i).className=i===n?'':'hide')}

function split(l){return l.split(/\t|\s{2,}|[|｜,，]/).map(s=>s.trim()).filter(Boolean)}

function parse(){
  const lines=document.getElementById('txt').value.split('\n').map(l=>l.trim()).filter(Boolean);
  let items=[];
  const hi=lines.findIndex(l=>l.includes('品番')||l.includes('ヒンバン'));
  if(hi>=0){
    const hs=split(lines[hi]);
    const ci=(kw)=>hs.findIndex(h=>kw.some(k=>h.includes(k)));
    const ni=ci(['内']),bi=ci(['品番','ヒンバン']),ki=ci(['納期']),si=ci(['納入先','納先']);
    for(let i=hi+1;i<lines.length;i++){
      const c=split(lines[i]);
      const nai=c[ni]||'',hb=c[bi]||'',noki=c[ki]||'',ny=c[si]||'';
      if(nai.startsWith('NL:')||!hb)continue;
      items.push({nai,hinban:hb,noki,nyusaki:ny});
    }
  }else{
    let cur={};
    for(const l of lines){
      if(/^内\s*[:：]/.test(l))cur.nai=l.replace(/^[^:：]+[:：]/,'').trim();
      else if(/^品番\s*[:：]/.test(l)){cur={};cur.hinban=l.replace(/^[^:：]+[:：]/,'').trim();}
      else if(/^納期\s*[:：]/.test(l))cur.noki=l.replace(/^[^:：]+[:：]/,'').trim();
      else if(/^納入先\s*[:：]/.test(l)){cur.nyusaki=l.replace(/^[^:：]+[:：]/,'').trim();if(cur.hinban)items.push({...cur});}
      else{const m=RE.exec(l.toUpperCase());if(m){cur={hinban:m[0].toUpperCase(),nai:'',noki:'',nyusaki:''};}}
    }
    if(cur.hinban)items.push({nai:'',noki:'',nyusaki:'',...cur});
  }
  all=items.filter(i=>RE.test((i.hinban||'').toUpperCase()));
  if(!all.length){alert('該当品番(????T?200〜650)が見つかりませんでした');return;}
  selK.clear();selN.clear();
  mkCB('noki',[...new Set(all.map(i=>i.noki).filter(Boolean))].sort(),selK);
  mkCB('nyusaki',[...new Set(all.map(i=>i.nyusaki).filter(Boolean))].sort(),selN);
  go(2);
}

function mkCB(id,opts,set){
  const el=document.getElementById(id);
  if(!opts.length){el.innerHTML='<p style="color:#999;font-size:13px">（データなし）</p>';return;}
  el.innerHTML='';
  opts.forEach(o=>{
    const lb=document.createElement('label');
    const cb=Object.assign(document.createElement('input'),{type:'checkbox',checked:set.has(o)});
    cb.onchange=()=>cb.checked?set.add(o):set.delete(o);
    lb.append(cb,o);el.appendChild(lb);
  });
}

function showResult(){
  if(!selK.size&&!selN.size){alert('1つ以上選択してください');return;}
  filtered=all.filter(i=>(!selK.size||selK.has(i.noki))&&(!selN.size||selN.has(i.nyusaki)));
  document.getElementById('cnt').textContent='表示件数: '+filtered.length+'件';
  document.getElementById('list').innerHTML=filtered.map(i=>
    `<div class="card"><div class="hb">${i.hinban}</div>`+
    (i.noki?`<div class="dt">納期: ${i.noki}</div>`:'')+
    (i.nyusaki?`<div class="dt">納入先: ${i.nyusaki}</div>`:'')+
    (i.nai?`<div class="dt">内: ${i.nai}</div>`:'')+`</div>`
  ).join('');
  go(3);
}

function showSummary(){
  const c={};
  filtered.forEach(i=>{const m=RE.exec((i.hinban||'').toUpperCase());if(m){const s=m[1];c[s]=(c[s]||0)+1;}});
  const e=Object.entries(c).sort((a,b)=>+a[0]-+b[0]);
  const t=e.reduce((s,[,v])=>s+v,0);
  let o='━━━━━━━━━━━━━━━━━━━━━━━━━━\n  品番 集計結果\n━━━━━━━━━━━━━━━━━━━━━━━━━━\n';
  e.forEach(([s,v])=>o+=`  ????T?${s.padEnd(3)} : ${String(v).padStart(4)} 個\n`);
  o+=`──────────────────────────\n  合　計    : ${String(t).padStart(4)} 個\n━━━━━━━━━━━━━━━━━━━━━━━━━━`;
  document.getElementById('sum').textContent=o;
  go(4);
}
</script>
</body></html>
